labels:
  platform: linux/amd64
when:
  - event: pull_request
  - event: push
    branch: [master, stable-*]
  - event: tag
variables:
  test-image: &test-image repo.osgeo.org/postgis/build-test:debian13

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 50
      partial: false

steps:
  source-distribution:
    image: *test-image
    pull: true
    # This is a pull-request check, not a release job. It must not sign,
    # upload, publish, or update release-facing documentation.
    commands:
      - export SRCDIR=$${CI_WORKSPACE}
      - python3 $${SRCDIR}/utils/ci_need_suite.py dist --upgrade-surface; gate_status=$$?; if test "$${gate_status}" = 78; then exit 0; elif test "$${gate_status}" != 0; then exit "$${gate_status}"; fi
      - export PGVER=18
      - export PATH=/usr/lib/postgresql/$${PGVER}/bin:$${PATH}
      - export TMPDIR=$${SRCDIR}/build/tmp
      - export DEBIAN_FRONTEND=noninteractive
      - check_start=$$(date +%s)
      - mkdir -p "$${TMPDIR}" "$${SRCDIR}/build/dist"
      - export MAKE="make -j1"
      - export CONFIGURE_ARGS="--with-pgconfig=/usr/lib/postgresql/$${PGVER}/bin/pg_config --without-raster"
      - apt-get update
      - apt-get install -y --no-install-recommends git2cl
      - rm -rf /var/lib/apt/lists/*
      - cd "$${SRCDIR}"
      - rm -rf postgis-dev postgis-ci-dist postgis-ci-dist.tar.gz postgis-ci-dist.tar.gz.md5
      - export newoutdir=postgis-ci-dist
      - time sh "$${SRCDIR}/make_dist.sh"
      - package=postgis-ci-dist.tar.gz
      - tail -n 20 "$${package}.md5"
      - '"$${SRCDIR}/utils/check_dist_manifest.sh" "$${package}" "$${SRCDIR}"'
      - cleanroom="$${SRCDIR}/build/dist-cleanroom"
      - rm -rf "$${cleanroom}"
      - mkdir -p "$${cleanroom}"
      - tar -xzf "$${package}" -C "$${cleanroom}"
      - unpacked=$$(find "$${cleanroom}" -mindepth 1 -maxdepth 1 -type d | head -1)
      - test ! -e "$${unpacked}/.git"
      - find "$${unpacked}" -type f | sed "s#^$${unpacked}/#./#" | sort > "$${cleanroom}/distclean-baseline.files"
      - cd "$${unpacked}"
      - ./configure $${CONFIGURE_ARGS}
      - make -j1
      - make -C liblwgeom/cunit check
      - make distclean
      - utils/check_distclean.sh "$${cleanroom}/distclean-baseline.files"
      - check_end=$$(date +%s)
      - echo "DIST_CHECK_WALL_CLOCK $$(($${check_end} - $${check_start})) seconds"
